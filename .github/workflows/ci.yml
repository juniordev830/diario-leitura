name: CI
on:
  push:
  pull_request:
jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: RAILS_ENV=test bundle exec rails db:prepare
      - run: RAILS_ENV=test bundle exec rails test
