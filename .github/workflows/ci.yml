name: Testar diário de leitura
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1
        with:
          ruby-version: '3.3'
      - run: ruby -Itest test/reading_journal_test.rb
      - run: ruby bin/demo.rb
